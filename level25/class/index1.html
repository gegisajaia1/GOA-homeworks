<!DOCTYPE html>
<html>
<head>
<title>My Daily Schedule</title>
</head>
<body>

<table border="1" cellpadding="8">
  <tr>
    <th colspan="4">My Daily Schedule</th>
  </tr>
  <tr>
    <th rowspan="2">Day</th>
    <th colspan="2">Schedule</th>
    <th rowspan="2">Activity</th>
  </tr>
  <tr>
    <th>Begin</th>
    <th>End</th>
  </tr>
  <tr>
    <td rowspan="3">Monday</td>
    <td>8:00 a.m.</td>
    <td>9:00 a.m.</td>
    <td>Breakfast</td>
  </tr>
  <tr>
    <td>9:00 a.m.</td>
    <td>1:00 p.m.</td>
    <td>Study</td>
  </tr>
  <tr>
    <td>2:00 p.m.</td>
    <td>6:00 p.m.</td>
    <td>hangout with friends</td>
  </tr>
  <tr>
    <td rowspan="2">Tuesday</td>
    <td>8:00 a.m.</td>
    <td>12:00 p.m.</td>
    <td>rest</td>
  </tr>
  <tr>
    <td>1:00 p.m.</td>
    <td>5:00 p.m.</td>
    <td>train</td>
  </tr>
  <tr>
    <td>Wednesday</td>
    <td>8:00 a.m.</td>
    <td>3:00 p.m.</td>
    <td>go to the beach</td>
  </tr>
</table>

</body>
</html>
