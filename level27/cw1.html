<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            color: white;
            margin: 5px;
        }

        .money {
            background-color: green;
        }

        .games {
            background-color: blue;
        }

        .plain {
            background-color: gray;
        }

        .food {
            background-color: orange;
        }

        .spyware {
            background-color: red;
        }
    </style>
</head>
<body>

    <button class="money">click me for free money</button> <br>
    <button class="games">click for free games</button> <br>
    <button class="plain">click me</button> <br>
    <button class="food">click me for food</button> <br>
    <button class="spyware">click me for spyware</button> <br>

</body>
</html>
